services:
  localstack:
    image: localstack/localstack:4.7.0  # latest(2026.x) はライセンストークン必須になったため、無料で動く 4.x に固定
    environment:
      - SERVICES=sqs
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "lab-queue"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1  # awslocal のデフォルトに合わせる（SQS キューはリージョン単位）
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - QUEUE_NAME=lab-queue
      # SQS ロングポーリングの待ち秒数。boto3 の receive_message がこの秒数ブロックする
      - WAIT_SECONDS=${WAIT_SECONDS:-5}
      # 1 にすると asyncio のデバッグモード。イベントループを 0.1 秒以上塞ぐと警告が出る
      - PYTHONASYNCIODEBUG=${ASYNCIO_DEBUG:-0}
    depends_on:
      localstack:
        condition: service_healthy

  # 負荷をかけて計測するクライアント。使い方: docker compose run --rm load async-boto3
  load:
    build: .
    profiles: ["tools"]
    environment:
      - BASE_URL=http://app:8000
    entrypoint: ["python", "scripts/load.py"]
    depends_on:
      - app
