[project]
name = "fastapi-blocking-io-lab"
version = "0.1.0"
description = "FastAPI の async def で boto3 を呼ぶとイベントループが止まるのを再現し、eBPF で検出する検証"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "aioboto3>=13",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false
